<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <title>Alpine Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css?v=20260520-checkout-options">
</head>
<body>

<div id="age-gate" class="age-gate hidden" role="dialog" aria-modal="true" aria-labelledby="age-gate-title">
    <div class="age-gate-card">
        <div class="age-gate-progress">
            <span id="onboarding-step-pill-1" class="onboarding-step-pill active">1</span>
            <span id="onboarding-step-pill-2" class="onboarding-step-pill">2</span>
            <span id="onboarding-step-pill-3" class="onboarding-step-pill">3</span>
        </div>
        <p id="onboarding-progress-label" class="onboarding-progress-label"></p>

        <div id="onboarding-step-1">
            <h2 id="age-gate-title"></h2>
            <p id="age-gate-text"></p>
            <div class="age-gate-actions">
                <button id="age-gate-accept" type="button" class="age-gate-btn age-gate-btn-primary"></button>
                <button id="age-gate-decline" type="button" class="age-gate-btn age-gate-btn-secondary"></button>
            </div>
        </div>

        <div id="onboarding-step-2" class="hidden">
            <h2 id="contact-method-title"></h2>
            <p id="contact-method-text"></p>
            <div class="contact-method-grid">
                <button id="contact-method-signal" type="button" class="contact-method-card">
                    <span class="contact-method-name">Signal</span>
                </button>
                <button id="contact-method-threema" type="button" class="contact-method-card">
                    <span class="contact-method-name">Threema</span>
                </button>
            </div>
            <div class="age-gate-actions">
                <button id="contact-method-back" type="button" class="age-gate-btn age-gate-btn-secondary"></button>
                <button id="contact-method-next" type="button" class="age-gate-btn age-gate-btn-primary"></button>
            </div>
        </div>

        <div id="onboarding-step-3" class="hidden">
            <h2 id="contact-input-title"></h2>
            <p id="contact-input-text"></p>
            <label for="contact-input-value" id="contact-input-label" class="onboarding-input-label"></label>
            <input id="contact-input-value" type="text" class="onboarding-input" />
            <p id="contact-input-error" class="onboarding-input-error hidden"></p>
            <div class="age-gate-actions">
                <button id="contact-input-back" type="button" class="age-gate-btn age-gate-btn-secondary"></button>
                <button id="contact-input-save" type="button" class="age-gate-btn age-gate-btn-primary"></button>
            </div>
        </div>
    </div>
</div>

<div id="catalog-access-error" class="catalog-access-error hidden" role="alert" aria-live="assertive">
    <p id="catalog-access-error-msg"></p>
</div>

<!-- #region Toast -->
<div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>
<!-- #endregion -->

<!-- #region Order success -->
<div class="order-success-overlay" id="order-success-overlay" role="dialog" aria-modal="true" aria-labelledby="order-success-title" hidden>
    <div class="order-success-card">
        <div class="order-success-icon" aria-hidden="true">✓</div>
        <h2 class="order-success-title" id="order-success-title">Commande bien reçue</h2>
        <p class="order-success-ref" id="order-success-ref"></p>
        <ol class="order-success-steps" id="order-success-steps"></ol>
        <p class="order-success-note" id="order-success-note"></p>
        <button type="button" class="btn-order-success-primary" id="order-success-btn">Ouvrir le chat Telegram</button>
        <button type="button" class="btn-order-success-secondary" id="order-success-close">Rester sur le catalogue</button>
    </div>
</div>
<!-- #endregion -->

<!-- #region App -->
<div id="app">
    <!-- #region Header / Banner — Logo centré style hero (comme ref ) -->
    <header class="banner">
        <div class="banner-inner">
            <p class="banner-logo-text" aria-label="Alpine Connexion">Alpine Connexion</p>
        </div>
    </header>
    <!-- #endregion -->

    <!-- #region Vue Catalogue -->
    <div class="view-panel" id="view-catalog">
        <nav class="filter-bar" aria-label="Filtres">
            <div class="filter-bar-top">
                <select class="lang-select" id="lang-switch" onchange="setLang(this.value)" aria-label="Langue">
                    <option value="fr">FR</option>
                    <option value="en">EN</option>
                    <option value="de">DE</option>
                </select>
                <button type="button" class="contact-edit-btn" id="btn-edit-contact"></button>
            </div>
            <div class="category-chips-scroll" id="category-chips" role="tablist" aria-label="Catégories"></div>
        </nav>
        <main class="products-wrap">
            <div class="products-grid" id="products-grid"></div>
        </main>
    </div>
    <!-- #endregion -->

    <!-- #region Bottom navigation -->
    <nav class="bottom-nav" aria-label="Navigation principale">
        <button type="button" class="bottom-nav-item active" id="nav-catalog" onclick="showView('catalog')" aria-current="page">
            <span class="bottom-nav-icon">🛒</span>
            <span class="bottom-nav-label" id="nav-catalog-label">Catalogue</span>
        </button>
    </nav>
    <!-- #endregion -->
</div>
<!-- #endregion -->

<!-- #region Product Modal -->
<div class="modal-overlay" id="product-modal" onclick="closeProductModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <button class="modal-close" onclick="closeProductModal()">✕</button>
        <div class="modal-scroll" id="modal-scroll">
            <div id="modal-content"></div>
        </div>
        <div class="modal-sticky-bar" id="modal-sticky-bar">
            <p class="modal-sticky-hint hidden" id="modal-sticky-hint" role="status"></p>
            <div class="modal-sticky-row">
                <div class="modal-sticky-price hidden" id="modal-sticky-price" aria-live="polite"></div>
                <button type="button" class="btn-add-cart btn-add-cart-sticky" id="btn-add" onclick="addToCart()" disabled></button>
            </div>
        </div>
    </div>
</div>
<!-- #endregion -->

<!-- #region Cart Modal -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart(event)">
    <div class="cart-panel" onclick="event.stopPropagation()">
        <div class="cart-panel-header">
            <h2 class="cart-panel-title" id="cart-title">🛒 Panier</h2>
            <button class="modal-close" onclick="closeCart()" style="position:static;">✕</button>
        </div>
        <div id="cart-items"></div>
    </div>
</div>
<!-- #endregion -->

<!-- #region Cart Button (FAB) -->
<button class="cart-fab" id="cart-fab" onclick="openCart()">
    🛒
    <span class="cart-fab-badge" id="cart-badge">0</span>
</button>
<!-- #endregion -->

<!-- #region Scripts -->
<script src="app.js?v=20260520-checkout-options"></script>
<!-- #endregion -->
</body>
</html>
